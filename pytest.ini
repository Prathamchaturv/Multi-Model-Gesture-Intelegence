[pytest]
# Pytest configuration for MMGI test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (medium speed)
    e2e: End-to-end tests (slower, comprehensive)
    performance: Performance/load tests
    stress: Stress tests
    security: Security/authentication tests
    slow: Slow tests (use --run-slow to run)

# Coverage options
[coverage:run]
branch = True
source = engine, core, ui, utils

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abstractproperty

# Timeout (in seconds)
timeout = 300
timeout_method = thread

# Minimum Python version
minversion = 3.8

# Test paths
testpaths = tests

# Asyncio mode
asyncio_mode = auto
